<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Olive AI</title>

    <link rel="stylesheet" href="olive1.css">
</head>

<body>

<div id="chat">

    <!-- HEADER -->
    <header id="header">

        <div id="title">
            Olive AI
        </div>

        <div id="status">
            ● Online
        </div>

    </header>


    <!-- MESSAGES -->
    <div id="messages">

        <div class="ai welcome">

            <div class="message-name">
                Olive
            </div>

            <div class="message-text">
                Hello! I'm Olive AI. 🫒
            </div>

        </div>

    </div>


    <!-- INPUT -->
    <div id="inputArea">

        <input
            id="userInput"
            type="text"
            placeholder="Message Olive..."
            autocomplete="off"
        >

        <button id="sendButton">
            Send
        </button>

        <button id="clearButton">
            Clear
        </button>

    </div>

</div>


<!-- JAVASCRIPT -->
<script src="oliveart1.js"></script>
<script src="olive1.js"></script>

</body>
</html>
